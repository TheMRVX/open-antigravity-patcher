name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'
      draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Create as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Windows x64 (Executable)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          architecture: 'x64'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Binary with PyInstaller
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] || [ "$VERSION" = "main" ] && VERSION="${{ github.event.inputs.tag_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="1.4.0"

          pyinstaller --onefile \
            --uac-admin \
            --icon=icon.ico \
            --name="open-ag-patcher_${VERSION}_windows_x64" \
            --noupx \
            --clean \
            --version-file=version.txt \
            main.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: assets-windows-x64
          path: dist/*.exe

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows ARM64 (Executable)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-arm64:
    name: Build Windows (ARM64)
    runs-on: windows-11-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Binary with PyInstaller
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] || [ "$VERSION" = "main" ] && VERSION="${{ github.event.inputs.tag_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="1.4.0"

          pyinstaller --onefile \
            --uac-admin \
            --icon=icon.ico \
            --name="open-ag-patcher_${VERSION}_windows_arm64" \
            --noupx \
            --clean \
            --version-file=version.txt \
            main.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: assets-windows-arm64
          path: dist/*.exe

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux x64 (tar.gz and .deb)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Binary with PyInstaller
        run: >
          pyinstaller --onefile
          --icon=icon.ico
          --name="open-ag-patcher"
          --hidden-import=packaging
          --hidden-import=packaging.version
          --hidden-import=packaging.specifiers
          --hidden-import=packaging.requirements
          --clean
          main.py

      - name: Package Tarball and Debian (.deb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] || [ "$VERSION" = "main" ] && VERSION="${{ github.event.inputs.tag_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="1.4.0"

          # Tarball
          tar -czvf "dist/open-ag-patcher_${VERSION}_linux_x64.tar.gz" -C dist open-ag-patcher -C .. README.md LICENSE

          # Debian package
          DEB_DIR="deb_x64"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/local/bin"
          cp dist/open-ag-patcher "$DEB_DIR/usr/local/bin/open-ag-patcher"
          chmod 755 "$DEB_DIR/usr/local/bin/open-ag-patcher"

          cat << EOF > "$DEB_DIR/DEBIAN/control"
          Package: open-ag-patcher
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: TheMRVX <https://github.com/TheMRVX/open-antigravity-patcher>
          Description: Open-source region lock bypass & patcher for Antigravity 2.0, IDE, CLI, and VS Code.
          EOF

          dpkg-deb --build "$DEB_DIR" "dist/open-ag-patcher_${VERSION}_linux_amd64.deb"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: assets-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.deb

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux ARM64 (tar.gz and .deb)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Binary with PyInstaller
        run: >
          pyinstaller --onefile
          --icon=icon.ico
          --name="open-ag-patcher"
          --hidden-import=packaging
          --hidden-import=packaging.version
          --hidden-import=packaging.specifiers
          --hidden-import=packaging.requirements
          --clean
          main.py

      - name: Package Tarball and Debian (.deb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] || [ "$VERSION" = "main" ] && VERSION="${{ github.event.inputs.tag_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="1.4.0"

          # Tarball
          tar -czvf "dist/open-ag-patcher_${VERSION}_linux_arm64.tar.gz" -C dist open-ag-patcher -C .. README.md LICENSE

          # Debian package
          DEB_DIR="deb_arm64"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/local/bin"
          cp dist/open-ag-patcher "$DEB_DIR/usr/local/bin/open-ag-patcher"
          chmod 755 "$DEB_DIR/usr/local/bin/open-ag-patcher"

          cat << EOF > "$DEB_DIR/DEBIAN/control"
          Package: open-ag-patcher
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: TheMRVX <https://github.com/TheMRVX/open-antigravity-patcher>
          Description: Open-source region lock bypass & patcher for Antigravity 2.0, IDE, CLI, and VS Code.
          EOF

          dpkg-deb --build "$DEB_DIR" "dist/open-ag-patcher_${VERSION}_linux_arm64.deb"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: assets-linux-arm64
          path: |
            dist/*.tar.gz
            dist/*.deb

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS Universal2 (ZIP archive)
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (Universal2)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python (Universal2)
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller (Universal2)
        run: >
          pyinstaller --onefile
          --name="open-ag-patcher"
          --target-arch universal2
          --hidden-import=packaging
          --hidden-import=packaging.version
          --hidden-import=packaging.specifiers
          --hidden-import=packaging.requirements
          --clean
          main.py

      - name: Package ZIP Archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] || [ "$VERSION" = "main" ] && VERSION="${{ github.event.inputs.tag_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="1.4.0"

          chmod +x dist/open-ag-patcher
          zip -j "dist/open-ag-patcher_${VERSION}_macos_universal.zip" dist/open-ag-patcher README.md LICENSE

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: assets-macos
          path: dist/*.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release with Checksums & Artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: all_dist
          merge-multiple: true

      - name: Generate Checksums (SHA-256)
        id: checksums
        run: |
          mkdir -p release_assets
          cp all_dist/* release_assets/ 2>/dev/null || true

          cd release_assets
          sha256sum * > checksums.txt || shasum -a 256 * > checksums.txt
          cat checksums.txt
          cd ..

      - name: Determine Release Tag & Version
        id: release_info
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ -z "$TAG" ] || [ "$TAG" = "main" ] && TAG="${{ github.event.inputs.tag_name }}"
          [ -z "$TAG" ] && TAG="v1.4.0"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Create Release Notes & Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.tag_name }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: release_assets/*
