name: Build Python (CI Test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Windows: x64
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          architecture: 'x64'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile \
            --uac-admin \
            --icon=icon.ico \
            --name="open-ag-patcher_windows_x64" \
            --noupx \
            --clean \
            --version-file=version.txt \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows ARM64
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-arm64:
    name: Build Windows (ARM64)
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile \
            --uac-admin \
            --icon=icon.ico \
            --name="open-ag-patcher_windows_arm64" \
            --noupx \
            --clean \
            --version-file=version.txt \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: dist/*.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux x64
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller and Package
        run: |
          pyinstaller --onefile \
            --icon=icon.ico \
            --name="open-ag-patcher" \
            --hidden-import=packaging \
            --hidden-import=packaging.version \
            --hidden-import=packaging.specifiers \
            --hidden-import=packaging.requirements \
            --clean \
            main.py

          tar -czvf dist/open-ag-patcher_linux_x64.tar.gz -C dist open-ag-patcher -C .. README.md LICENSE

          DEB_DIR="deb_x64"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/local/bin"
          cp dist/open-ag-patcher "$DEB_DIR/usr/local/bin/open-ag-patcher"
          chmod 755 "$DEB_DIR/usr/local/bin/open-ag-patcher"
          cat << EOF > "$DEB_DIR/DEBIAN/control"
          Package: open-ag-patcher
          Version: 1.4.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: TheMRVX <https://github.com/TheMRVX/open-antigravity-patcher>
          Description: Open-source region lock bypass & patcher for Antigravity.
          EOF
          dpkg-deb --build "$DEB_DIR" "dist/open-ag-patcher_linux_amd64.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux ARM64
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller and Package
        run: |
          pyinstaller --onefile \
            --icon=icon.ico \
            --name="open-ag-patcher" \
            --hidden-import=packaging \
            --hidden-import=packaging.version \
            --hidden-import=packaging.specifiers \
            --hidden-import=packaging.requirements \
            --clean \
            main.py

          tar -czvf dist/open-ag-patcher_linux_arm64.tar.gz -C dist open-ag-patcher -C .. README.md LICENSE

          DEB_DIR="deb_arm64"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/local/bin"
          cp dist/open-ag-patcher "$DEB_DIR/usr/local/bin/open-ag-patcher"
          chmod 755 "$DEB_DIR/usr/local/bin/open-ag-patcher"
          cat << EOF > "$DEB_DIR/DEBIAN/control"
          Package: open-ag-patcher
          Version: 1.4.0
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: TheMRVX <https://github.com/TheMRVX/open-antigravity-patcher>
          Description: Open-source region lock bypass & patcher for Antigravity.
          EOF
          dpkg-deb --build "$DEB_DIR" "dist/open-ag-patcher_linux_arm64.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS Universal2
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (Universal2)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python (universal2)
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller (Universal2)
        run: |
          pyinstaller --onefile \
            --name="open-ag-patcher" \
            --target-arch universal2 \
            --hidden-import=packaging \
            --hidden-import=packaging.version \
            --hidden-import=packaging.specifiers \
            --hidden-import=packaging.requirements \
            --clean \
            main.py

          chmod +x dist/open-ag-patcher
          zip -j dist/open-ag-patcher_macos_universal.zip dist/open-ag-patcher README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.zip
          if-no-files-found: error
